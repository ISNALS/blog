<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="逐帧看片封面">
  <defs>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d96f4a" stop-opacity="0.05" />
      <stop offset="0.55" stop-color="#d96f4a" stop-opacity="0.85" />
      <stop offset="1" stop-color="#d96f4a" stop-opacity="0.10" />
    </linearGradient>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#0b0b0c" />

  <!-- 一条时间轴：虚线是静止帧，实色块是"变化发生的那几帧" -->
  <g>
    <line x1="120" y1="500" x2="1480" y2="500" stroke="#f2f0ec" stroke-opacity="0.16" stroke-width="2" stroke-dasharray="6 10" />
    <rect x="742" y="452" width="116" height="96" fill="url(#ramp)" />
    <rect x="742" y="452" width="116" height="96" fill="none" stroke="#d96f4a" stroke-width="2" />
  </g>

  <!-- 逐帧条：同一动作在不同帧的显影程度 -->
  <g>
    <g transform="translate(120 200)">
      <rect width="96" height="150" fill="#121214" stroke="#232326" />
      <rect x="18" y="46" width="60" height="58" fill="#f2f0ec" opacity="0.10" filter="url(#haze)" />
    </g>
    <g transform="translate(240 180)">
      <rect width="96" height="190" fill="#121214" stroke="#232326" />
      <rect x="18" y="56" width="60" height="70" fill="#f2f0ec" opacity="0.22" filter="url(#haze)" />
    </g>
    <g transform="translate(360 150)">
      <rect width="96" height="250" fill="#121214" stroke="#232326" />
      <rect x="18" y="66" width="60" height="110" fill="#d96f4a" opacity="0.45" filter="url(#haze)" />
    </g>
    <g transform="translate(480 120)">
      <rect width="96" height="310" fill="#121214" stroke="#d96f4a" stroke-width="2" />
      <rect x="18" y="80" width="60" height="150" fill="#d96f4a" />
    </g>
    <g transform="translate(600 120)">
      <rect width="96" height="310" fill="#121214" stroke="#232326" />
      <rect x="18" y="80" width="60" height="150" fill="#d96f4a" opacity="0.9" />
    </g>
    <g transform="translate(720 140)">
      <rect width="96" height="270" fill="#121214" stroke="#232326" />
      <rect x="18" y="72" width="60" height="126" fill="#d96f4a" opacity="0.7" filter="url(#haze)" />
    </g>
    <g transform="translate(840 170)">
      <rect width="96" height="210" fill="#121214" stroke="#232326" />
      <rect x="18" y="62" width="60" height="90" fill="#f2f0ec" opacity="0.35" filter="url(#haze)" />
    </g>
  </g>

  <!-- 右侧：被摊开的五十格 -->
  <g transform="translate(1020 200)">
    <g fill="#f2f0ec" fill-opacity="0.12">
      <rect x="0" y="0" width="420" height="8" />
      <rect x="0" y="26" width="420" height="8" />
      <rect x="0" y="52" width="420" height="8" />
      <rect x="0" y="78" width="420" height="8" />
      <rect x="0" y="104" width="420" height="8" />
    </g>
    <g fill="#d96f4a">
      <rect x="0" y="130" width="420" height="8" opacity="0.9" />
      <rect x="0" y="156" width="420" height="8" opacity="0.75" />
      <rect x="0" y="182" width="420" height="8" opacity="0.55" />
    </g>
    <g fill="#f2f0ec" fill-opacity="0.12">
      <rect x="0" y="208" width="420" height="8" />
      <rect x="0" y="234" width="420" height="8" />
      <rect x="0" y="260" width="420" height="8" />
    </g>
    <text x="0" y="330" fill="#6f6d69" font-family="monospace" font-size="22" letter-spacing="4">8f → 11f</text>
  </g>
</svg>
