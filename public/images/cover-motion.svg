<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="动效封面">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="46" />
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d96f4a" stop-opacity="0.9" />
      <stop offset="1" stop-color="#d96f4a" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#0b0b0c" />

  <!-- 由模糊到清晰：同一形状的四个"通道"，彼此错开 -->
  <g filter="url(#soft)" opacity="0.55">
    <circle cx="470" cy="620" r="190" fill="#d96f4a" opacity="0.30" />
    <circle cx="620" cy="470" r="210" fill="#d96f4a" opacity="0.38" />
    <circle cx="820" cy="430" r="230" fill="#d96f4a" opacity="0.5" />
  </g>

  <g>
    <rect x="880" y="250" width="420" height="420" fill="none" stroke="#f2f0ec" stroke-opacity="0.5" stroke-width="2" />
    <rect x="960" y="330" width="420" height="420" fill="none" stroke="#d96f4a" stroke-width="3" />
    <rect x="1040" y="410" width="420" height="420" fill="url(#fade)" opacity="0.85" />
  </g>

  <!-- 上浮的刻度 -->
  <g stroke="#f2f0ec" stroke-opacity="0.28" stroke-width="2">
    <line x1="140" y1="860" x2="1460" y2="860" />
    <line x1="140" y1="840" x2="140" y2="880" />
    <line x1="440" y1="846" x2="440" y2="874" />
    <line x1="740" y1="840" x2="740" y2="880" />
    <line x1="1040" y1="846" x2="1040" y2="874" />
    <line x1="1340" y1="840" x2="1340" y2="880" />
  </g>
  <circle cx="740" cy="860" r="9" fill="#d96f4a" />
</svg>
